# Maestarr next to an existing *arr stack.
#
#   docker compose up -d
#   → open http://127.0.0.1:8709 and follow the setup wizard.
#
# Put Maestarr on the same Docker network as Sonarr/Radarr/qBittorrent so the
# wizard can reach them by name (http://sonarr:8989 …). The network below is
# called `arr`; rename it to whatever your stack uses.

services:
  maestarr:
    image: ghcr.io/ekinbasarkomur/maestarr:latest
    # To build from a checkout instead: comment the line above and use
    # image: maestarr:local
    # build: .
    container_name: maestarr
    restart: unless-stopped
    # A real init as PID 1, so exited healthcheck processes are reaped.
    init: true
    volumes:
      # Database (settings, conversations), preferences and logs.
      - ./data:/data
    ports:
      # Loopback only. Put a reverse proxy with TLS in front to reach it from
      # elsewhere — Maestarr can add and delete things in your library.
      - "127.0.0.1:8709:8709"
    mem_limit: 512m
    networks:
      - arr

networks:
  arr:
    external: true
