name: Release

# Push a tag like v0.3.0 to publish ghcr.io/ekinbasarkomur/maestarr:<version>
# (and :latest) for amd64 and arm64, and a GitHub release with the changelog.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is this the newest version?
        id: latest
        # Only the highest version gets :latest, so a slow build of an older tag
        # can never move :latest backwards.
        run: |
          newest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          echo "is_latest=$([ "$newest" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/maestarr
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest }}
          labels: |
            org.opencontainers.image.title=Maestarr
            org.opencontainers.image.description=An AI conductor for your *arr stack
            org.opencontainers.image.licenses=GPL-3.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          printf '\n```yaml\nimage: ghcr.io/%s/maestarr:%s\n```\n' "${{ github.repository_owner }}" "$version" >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
