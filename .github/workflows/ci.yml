name: CI

on:
  push:
    branches: ["**"]  # every branch, so feature work is checked before it is merged
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Doctests
        run: python -m pytest -q --doctest-modules maestarr --ignore=maestarr/web -p no:cacheprovider -k "not test_"
      - name: Types
        run: python -m mypy maestarr

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Lint, types, tests
        run: npm run verify
      - name: Build
        run: mkdir -p ../maestarr && npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
