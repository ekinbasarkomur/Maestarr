name: CI

on:
  push:
    branches: ["**"]  # every branch, so feature work is checked before it is merged
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Doctests
        run: python -m pytest -q --doctest-modules maestarr --ignore=maestarr/web -p no:cacheprovider -k "not test_"
      - name: Types
        run: python -m mypy maestarr

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Lint, types, tests
        run: npm run verify
      - name: Build
        run: mkdir -p ../maestarr && npm run build

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Tag for this branch
        id: tag
        # Feature and fix branches get a test image (arm64 + amd64), e.g.
        # :feature-caching-and-home, to try on a real stack before merging.
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          case "$GITHUB_REF_NAME" in
            feature/*|fix/*) echo "push=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "push=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "name=ghcr.io/${{ github.repository_owner }}/maestarr:${branch}" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image (pushed for feature/fix branches only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.tag.outputs.push == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ steps.tag.outputs.push == 'true' }}
          tags: ${{ steps.tag.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
